name: Update Publications from Scholar

on:
  schedule:
    - cron: '0 12 * * 1'   # every Monday at noon UTC
  workflow_dispatch:

jobs:
  update_pubs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      - name: Install scholarly and pyyaml
        run: |
          pip install scholarly pyyaml
      - name: Fetch Google Scholar publications
        run: python fetch_scholar.py
      - name: Commit and push if there are changes
        run: |
          git config --local user.email "github-actions@github.com"
          git config --local user.name "GitHub Actions"
          git add data/publications.yaml
          git diff --cached --quiet || git commit -m "Auto-update publications from Google Scholar"
          git push
